<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>114 Web Labs - 櫻錡的練習作品集</title>
    <style>
        /* 基本重置與字體 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: #fffafa; /* 輕盈的雪白色 */
            color: #7a6e6e; /* 溫柔的灰褐色 */
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Canvas 背景樣式 - 夢幻泡泡感 */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 100%);
        }

        /* 內容容器 */
        .container {
            width: 90%;
            max-width: 500px;
            text-align: center;
            z-index: 1;
            padding: 50px 30px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px); /* 玻璃擬態 */
            border-radius: 40px; /* 超圓潤轉角 */
            border: 2px solid #ffffff;
            box-shadow: 0 20px 40px rgba(255, 182, 193, 0.15);
        }

        /* 標題與名字 */
        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ff8fa3; /* 甜美主色 */
            letter-spacing: 1px;
        }

        .author-name {
            font-size: 1rem;
            color: #bfa3a8;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .author-name::before, .author-name::after {
            content: "✿"; /* 用可愛的小花代替橫線 */
            color: #ffb3c1;
        }

        /* 導覽連結清單 */
        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .nav-item {
            text-decoration: none;
            background: #ffffff;
            padding: 18px 25px;
            border-radius: 20px;
            color: #8a7e7e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid #ffe5ec;
        }

        .nav-item:hover {
            background: #fff0f3;
            transform: translateY(-3px);
            border-color: #ffb3c1;
            box-shadow: 0 10px 20px rgba(255, 143, 163, 0.1);
        }

        .nav-item h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .nav-item .arrow {
            color: #ffb3c1;
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }

        .nav-item:hover .arrow {
            transform: translateX(5px);
        }

        /* 底部裝飾 */
        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            color: #d1b8bc;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <header>
            <h1>My Web Labs</h1>
            <div class="author-name">由 王櫻錡 設計製作</div>
        </header>

        <nav class="nav-list">
            <a href="lab1/index.html" class="nav-item">
                <h3>Lab 01: 基礎網頁入門</h3>
                <span class="arrow">♡</span>
            </a>
            <a href="lab2/index.html" class="nav-item">
                <h3>Lab 02: CSS 藝術與排版</h3>
                <span class="arrow">♡</span>
            </a>
            <a href="lab3/index.html" class="nav-item">
                <h3>Lab 03: JavaScript 互動</h3>
                <span class="arrow">♡</span>
            </a>
            <a href="lab4/index.html" class="nav-item">
                <h3>Lab 04: 甜美風格實作</h3>
                <span class="arrow">♡</span>
            </a>
        </nav>

        <footer>
            &copy; 2026 114 Web Dev Course
        </footer>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 50; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 5 + 2, // 泡泡大一點
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.3,
                    opacity: Math.random() * 0.3 + 0.1
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 182, 193, ${p.opacity})`; // 粉色泡泡
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;
            });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
